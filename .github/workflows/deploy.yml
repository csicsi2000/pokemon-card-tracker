name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages needs these; GITHUB_TOKEN is otherwise read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # BASE_PATH is the repo name, because project Pages sites are served from
      # https://<user>.github.io/<repo>/ rather than the domain root.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Optional: enables Google Drive sync. Set it under Settings → Secrets and
          # variables → Actions → Variables. It is a public OAuth client id, not a secret.
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
